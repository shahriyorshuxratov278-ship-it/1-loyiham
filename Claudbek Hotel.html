<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claudbek Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e3;--ink:#0d2038;--mut:#51637a;--card:#fffdf7;--lapis:#12408a;--teal:#14a89b;--gold:#f2a516;--line:#e2d8bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f22;--ink:#f3eddc;--mut:#a8b6c9;--card:#0e1d3c;--lapis:#6b97f5;--teal:#35d4c4;--gold:#ffbd3a;--line:#223a60}}
:root[data-theme="dark"]{--bg:#070f22;--ink:#f3eddc;--mut:#a8b6c9;--card:#0e1d3c;--lapis:#6b97f5;--teal:#35d4c4;--gold:#ffbd3a;--line:#223a60}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;height:auto}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#050d24;z-index:40}
h1,h2,h3{font-family:Unbounded,Arial Black,system-ui,sans-serif;line-height:1.15}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 5vw;background:#050d24;color:#f3eddc}
.logo{font:800 1.2rem Unbounded,sans-serif;margin-right:auto;display:flex;gap:10px;align-items:center;color:#ffd27a}
.logo svg{width:34px;height:34px}
select,button,input{font:inherit;color:inherit}
select{background:#12275a;color:#fff;border:1px solid #2b4a8c;border-radius:10px;padding:8px}
.btn{background:var(--gold);color:#1a1200;border:0;border-radius:999px;padding:10px 20px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -6px var(--gold)}
.btn.alt{background:transparent;border:2px solid currentColor}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hero{position:relative;min-height:92vh;display:flex;flex-direction:column;justify-content:flex-start;padding:8vh 5vw 0;overflow:hidden;color:#f3eddc;background:linear-gradient(#050d24 0%,#10275c 55%,#4a3470 100%)}
.hero h1{font-size:clamp(1.9rem,6vw,4.4rem);font-weight:800;max-width:14ch;position:relative;z-index:2;text-shadow:0 4px 30px #000a}
.hero p{max-width:44ch;margin:16px 0 24px;font-size:1.1rem;color:#d6dcee;position:relative;z-index:2}
.row{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:2}
.scene{position:absolute;left:0;bottom:0;width:100%;height:56%;z-index:1}
.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.drive{position:absolute;bottom:3.5%;width:150px;z-index:3;animation:go 16s linear infinite}
.drive.b{width:210px;bottom:5%;animation-duration:24s;animation-delay:-9s}
@keyframes go{from{left:-25%}to{left:110%}}
.glow{animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{opacity:.75}}
section{padding:80px 5vw}
.head{margin-bottom:34px}
.head h2{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:800}
.head p{color:var(--mut);max-width:55ch;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:150px 150px 22px 22px;padding:10px 10px 20px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-8px);box-shadow:0 24px 40px -24px var(--lapis)}
.art{height:190px;border-radius:140px 140px 14px 14px;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.card .in{padding:14px 12px 0}
.card h3{font-size:1.1rem;margin-bottom:4px}
.card p{color:var(--mut);font-size:.93rem}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.price{font-weight:800;color:var(--lapis)}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600}
.tab[aria-pressed=true]{background:var(--lapis);border-color:var(--lapis);color:#fff}
.band{margin:0 5vw;background:linear-gradient(120deg,#12408a,#0e7c86);color:#fff;border-radius:30px;padding:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;text-align:center}
.band b{font:800 2.2rem Unbounded,sans-serif;display:block;color:#ffd27a}
footer{padding:40px 5vw;border-top:1px solid var(--line);color:var(--mut);text-align:center}
dialog{border:0;border-radius:26px;padding:28px;width:min(92vw,420px);background:var(--card);color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(5,15,30,.7);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:12px;font-size:1.4rem}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.err{color:#e0457b;font-size:.88rem;min-height:1.2em;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:600;transition:transform .35s;z-index:50;text-align:center}
.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<section id="rooms" style="padding-top:0"><div class="head"><h2 data-i18n="t3"></h2><p data-i18n="s3"></p></div><div class="grid" id="rms"></div></section>

  <div class="grid" id="veh"></div>
</section>
<footer>© 2026 Claudbek Hotel · Xiva</footer>

<dialog id="dlg">

    <label for="n" data-i18n="ln"></label><input id="n" autocomplete="name">

  </form>
</dialog>

var lang="uz",filter="all",user=null,dlg=document.getElementById("dlg");
try{user=JSON.parse(localStorage.getItem("claudbek-user")||"null");lang=localStorage.getItem("claudbek-lang")||"uz"}catch(e){}
function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k}
function toast(m){var x=document.getElementById("toast");x.textContent=m;x.classList.add("on");setTimeout(function(){x.classList.remove("on")},2800)}
function card(art,name,sub,price,n){return '<div class="card"><div class="art">'+art+'</div><div class="in"><h3>'+name+'</h3><p>'+sub+'</p><div class="meta"><span class="price">'+price+'</span><button class="btn" data-n="'+n+'">'+t("book")+'</button></div></div></div>'}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.dataset.i18n)});
  if(user)document.getElementById("regBtn").textContent=t("hi")+", "+user.name.split(" ")[0];
  document.getElementById("locs").innerHTML=CITY.map(function(c,i){return '<div class="card"><div class="art" style="background:'+c[0]+'"><svg viewBox="0 0 300 180" preserveAspectRatio="xMidYMax slice">'+c[1]+'</svg></div><div class="in"><h3>'+NAMES[i]+'</h3><p>'+t(KEY[i])+'</p></div></div>'}).join("");
  document.getElementById("rms").innerHTML=RM.map(function(r){return card(room(r[1],r[2]),r[0],(r[1]+2)+' '+t("guest"),'$'+r[3]+' '+t("day"),r[0])}).join("");
  document.getElementById("veh").innerHTML=VEH.filter(function(v){return filter==="all"||v[2]===filter}).map(function(v){return card('<div style="height:100%;display:grid;align-items:end;padding:0 8px 24px;background:linear-gradient(#bfe3ff,#f6e7c4)">'+v[1]+'</div>',v[0],v[3]+' '+t("seat"),'$'+v[4]+' '+t("day"),v[0])}).join("");
}
document.getElementById("lang").value=lang;
document.getElementById("lang").onchange=function(e){lang=e.target.value;try{localStorage.setItem("claudbek-lang",lang)}catch(x){}render()};
document.getElementById("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;filter=b.dataset.f;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",x===b)});render()};
function book(e){var b=e.target.closest("button[data-n]");if(!b)return;if(!user){toast(t("need"));dlg.showModal();return}toast("✅ "+t("booked")+" "+b.dataset.n)}
document.getElementById("veh").onclick=book;document.getElementById("rms").onclick=book;
document.getElementById("regBtn").onclick=function(){if(user){toast(t("ok")+", "+user.name)}else dlg.showModal()};
document.getElementById("close").onclick=function(){dlg.close()};
document.getElementById("f").onsubmit=function(e){e.preventDefault();
  var n=this.n.value.trim(),em=this.e.value.trim(),p=this.p.value.trim(),w=this.w.value;
  if(n.length<2||!/^\S+@\S+\.\S+$/.test(em)||p.replace(/\D/g,"").length<9||w.length<6){document.getElementById("err").textContent=t("bad");return}
  user={name:n,email:em};try{localStorage.setItem("claudbek-user",JSON.stringify(user))}catch(x){}
  document.getElementById("err").textContent="";dlg.close();render();toast("🎉 "+t("ok")+", "+n)};
render();
